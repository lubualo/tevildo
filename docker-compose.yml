services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tevildo-backend
    ports:
      - "8000:8000"
    environment:
      - TEVILDO_DATA_DIR=/app/data
      - DEBUG=True
    volumes:
      # Bind mount for persistent data (SQLite DB + PDFs)
      - ./backend/data:/app/data
      # Bind mount for live code reloading during development
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/entrypoint.sh:/app/entrypoint.sh
    working_dir: /app
    restart: unless-stopped
